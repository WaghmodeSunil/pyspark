# This is a Declarative Automation Bundle definition for demo_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: demo_bundle
  uuid: 9de9ed61-2536-4d9a-8d6d-08b01e795b4e

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d1733e6f-1739.cloud.databricks.com
    variables:
      catalog: bundle_catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-d1733e6f-1739.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/2016bec008@sggs.ac.in to make sure we only have a single copy.
      root_path: /Workspace/Users/2016bec008@sggs.ac.in/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bundle_catalog
      schema: prod
    permissions:
      - user_name: 2016bec008@sggs.ac.in
        level: CAN_MANAGE
